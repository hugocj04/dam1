<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Rutinas del cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <header th:replace="fragments :: header"></header>
    <div th:replace="fragments :: menu"></div>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
                    <div class="card-header bg-dark text-warning py-3">
                        <h2 class="h5 mb-0">
                            <i class="bi bi-person-lines-fill me-2"></i>Consultar rutinas de cliente
                        </h2>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form th:action="@{/gestionRutinas/cliente}" method="get" class="mb-4">
                            <div class="mb-3">
                                <label for="clienteId" class="form-label fw-semibold">
                                    <i class="bi bi-person-fill me-2"></i>Seleccionar cliente
                                </label>
                                <div class="input-group">
                                    <select name="clienteId" id="clienteId" class="form-select" required>
                                        <option value="" disabled selected>Elige un cliente...</option>
                                        <option th:each="cliente : ${clientes}"
                                                th:value="${cliente.id}"
                                                th:text="${cliente.nombre + ' ' + cliente.apellidos}">
                                        </option>
                                    </select>
                                    <button type="submit" class="btn btn-warning text-dark">
                                        <i class="bi bi-funnel-fill"></i> Filtrar
                                    </button>
                                </div>
                            </div>
                        </form>

                        <div th:if="${cliente != null}">
                            <h3 class="h5 text-dark mb-4" th:text="'Rutina de ' + ${cliente.nombre} + ' ' + ${cliente.apellidos}"></h3>

                            <div th:if="${not #lists.isEmpty(cliente.ListaRutinas)}" class="table-responsive">
                                <table class="table table-bordered table-hover align-middle bg-white shadow-sm">
                                    <thead class="table-dark text-warning">
                                        <tr>
                                            <th class="text-nowrap">Día</th>
                                            <th>Ejercicio</th>
                                            <th>Series</th>
                                            <th>Repeticiones</th>
                                            <th>Peso (Kg)</th>
                                            <th>Imagen</th>
                                            <th>Descanso</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="rutina : ${cliente.ListaRutinas}">
                                            <td th:text="${rutina.diaSemana}" class="fw-semibold"></td>
                                            <td th:text="${rutina.ejercicio}"></td>
                                            <td th:text="${rutina.series}" class="text-center"></td>
                                            <td th:text="${rutina.repeticiones}" class="text-center"></td>
                                            <td th:text="${rutina.peso}" class="text-center"></td>
                                            <td class="text-center">
                                                <img th:src="${rutina.urlImagen}"
                                                     th:alt="${rutina.alt}"
                                                     class="img-fluid rounded"
                                                     style="width: 180px; height: 100px; object-fit: cover;">
                                            </td>
                                            <td th:text="${rutina.descanso}" class="text-center"></td>
                                        </tr>
                                    </tbody>
                                </table>

                                <div class="d-flex justify-content-end gap-2 mt-3">
                                    <a th:href="@{/gestionRutinas/editar/{id}(id=${cliente.id})}" class="btn btn-outline-primary">
                                        <i class="bi bi-pencil-square me-1"></i>Editar
                                    </a>
                                    <form th:action="@{'/gestionRutinas/borrar/' + ${cliente.id}}" method="post">
                                        <button type="submit" class="btn btn-outline-danger">
                                            <i class="bi bi-trash me-1"></i>Borrar rutinas
                                        </button>
                                    </form>
                                </div>
                            </div>

                            <div th:if="${#lists.isEmpty(cliente.ListaRutinas)}" class="alert alert-warning mt-4 text-center">
                                <i class="bi bi-exclamation-circle me-2"></i>No se han encontrado rutinas para este cliente.
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-dark py-3 text-center">
                        <small class="text-warning">
                            <i class="bi bi-info-circle me-1"></i> Filtra por cliente para ver sus rutinas
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments :: footer"></footer>
</body>
</html>
