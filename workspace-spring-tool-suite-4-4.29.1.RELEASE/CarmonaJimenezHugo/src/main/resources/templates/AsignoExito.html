<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Registro exitoso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <header th:replace="fragments :: header"></header>

    <div th:replace="fragments :: menu"></div>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-6">
                <div class="card shadow-sm border-0 rounded-3 overflow-hidden text-center">
                    <div class="card-header bg-success text-white py-3">
                        <h2 class="h5 mb-0">
                            <i class="bi bi-check-circle-fill me-2"></i>Asignación completada
                        </h2>
                    </div>
                    <div class="card-body p-4">
                        <p class="fs-5 text-dark mb-4">¡La rutina se ha asignado exitosamente!</p>
                        <div class="d-grid gap-3">
                            <a th:href="@{/asignarRutina}" class="btn btn-outline-success">
                                <i class="bi bi-person-plus me-2"></i>Asignar otra rutina
                            </a>
                            <a th:href="@{/gestionRutinas}" class="btn btn-warning text-dark">
                                <i class="bi bi-people-fill me-2"></i>Ver rutinas
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments :: footer"></footer>
    
</body>
</html>
