<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Editar Rutinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-white">

    <header th:replace="fragments :: header"></header>
    <div th:replace="fragments :: menu"></div>

    <main class="container-fluid flex-grow-1 py-4">
        <h2 class="mb-4 text-center">Editar Rutinas</h2>

        <div class="row justify-content-center mt-5">
            <div class="col-md-10">
                <h3 th:text="'Rutinas de ' + ${cliente.nombre} + ' ' + ${cliente.apellidos}" class="mb-4"></h3>

                <form method="post" th:action="@{'/gestionRutinas/guardar/' + ${cliente.id}}" th:object="${cliente}">
                    <table class="table table-bordered table-hover shadow-sm bg-white">
                        <thead class="table-primary">
                            <tr>
                                <th>Día</th>
                                <th>Ejercicio</th>
                                <th>Series</th>
                                <th>Repeticiones</th>
                                <th>Peso (Kg)</th>
                                <th>Descanso</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="rutina, iterStat : ${cliente.listaRutinas}">
                                <td>
                                    <input type="text" th:field="*{listaRutinas[__${iterStat.index}__].diaSemana}" class="form-control" required/>
                                </td>
                                <td>
                                    <input type="text" th:field="*{listaRutinas[__${iterStat.index}__].ejercicio}" class="form-control" required/>
                                </td>
                                <td>
                                    <input type="number" th:field="*{listaRutinas[__${iterStat.index}__].series}" class="form-control" required/>
                                </td>
                                <td>
                                    <input type="number" th:field="*{listaRutinas[__${iterStat.index}__].repeticiones}" class="form-control" required/>
                                </td>
                                <td>
                                    <input type="number" step="0.1" th:field="*{listaRutinas[__${iterStat.index}__].peso}" class="form-control" required/>
                                </td>
                                <td>
                                    <input type="time" th:field="*{listaRutinas[__${iterStat.index}__].descanso}" class="form-control" required/>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <button type="submit" class="btn btn-outline-success">
                            <i class="bi bi-save"></i> Guardar cambios
                        </button>
                        <a th:href="@{/gestionRutinas}" class="btn btn-outline-danger">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="fragments :: footer"></footer>
</body>
</html>
