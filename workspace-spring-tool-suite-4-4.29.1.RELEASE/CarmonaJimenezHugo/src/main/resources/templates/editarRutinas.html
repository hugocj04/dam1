<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Editar Rutinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <header th:replace="fragments :: header"></header>
    
    <div th:replace="fragments :: menu"></div>

    <main class="container flex-grow-1 py-5">
        <div class="text-center mb-5">
            <h2 class="h4 text-dark">
                <i class="bi bi-list-check me-2"></i>Gestión de rutinas
            </h2>
            <p class="text-muted mb-0">Consulta, edita o elimina rutinas asignadas</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-xl-11">
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                    <div class="card-header bg-dark text-warning py-3">
                        <h3 class="h6 mb-0" th:text="'Rutinas de ' + ${cliente.nombre} + ' ' + ${cliente.apellidos}"></h3>
                    </div>

                    <div class="card-body p-4 bg-white">
                        <form method="post" th:action="@{'/gestionRutinas/guardar/' + ${cliente.id}}" th:object="${cliente}">
                            <div class="table-responsive">
                                <table class="table table-bordered table-hover align-middle mb-4">
                                    <thead class="table-light">
                                        <tr>
                                            <th class="text-nowrap px-3">Día</th>
                                            <th class="px-3">Ejercicio</th>
                                            <th class="px-3">Series</th>
                                            <th class="px-3">Repeticiones</th>
                                            <th class="px-3">Peso (Kg)</th>
                                            <th class="px-3">Imagen</th>
                                            <th class="px-3">Descanso</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="rutina, iterStat : ${cliente.listaRutinas}">
                                            <td class="px-3">
                                                <input type="text" th:field="*{listaRutinas[__${iterStat.index}__].diaSemana}" class="form-control" required/>
                                            </td>
                                            <td class="px-3">
                                                <input type="text" th:field="*{listaRutinas[__${iterStat.index}__].ejercicio}" class="form-control" required/>
                                            </td>
                                            <td class="px-3">
                                                <input type="number" th:field="*{listaRutinas[__${iterStat.index}__].series}" class="form-control text-center" required/>
                                            </td>
                                            <td class="px-3">
                                                <input type="number" th:field="*{listaRutinas[__${iterStat.index}__].repeticiones}" class="form-control text-center" required/>
                                            </td>
                                            <td class="px-3">
                                                <input type="number" step="0.1" th:field="*{listaRutinas[__${iterStat.index}__].peso}" class="form-control text-center" required/>
                                            </td>
                                            <td class="px-3">
                                                <input type="url" th:field="*{listaRutinas[__${iterStat.index}__].urlImagen}" class="form-control text-center" required/>
                                            </td>
                                            <td class="px-3">
                                                <input type="time" th:field="*{listaRutinas[__${iterStat.index}__].descanso}" class="form-control text-center" required/>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="d-flex justify-content-end gap-3">
                                <button type="submit" class="btn btn-outline-success px-4">
                                    <i class="bi bi-save me-1"></i>Guardar cambios
                                </button>
                                <a th:href="@{/gestionRutinas}" class="btn btn-outline-danger px-4">
                                    <i class="bi bi-x-circle me-1"></i>Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments :: footer"></footer>

</body>
</html>
