<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Gestión para Gimnasios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-white">
    <header th:replace="fragments :: header"></header>
    
    <div th:replace="fragments :: menu"></div>

    <main class="container-fluid flex-grow-1">
        <section class="bg-dark text-white py-5">
            <div class="container py-4">
                <div class="row justify-content-center text-center">
                    <div class="col-lg-8">
                        <h1 class="display-5 fw-bold mb-4">Sistema de gestión para gimnasios</h1>
                        <p class="lead">
                            Control de clientes y rutinas en una sola plataforma
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <section class="container my-5 py-4">
            <div class="row justify-content-center">
                <div class="col-md-5 mb-4 mb-md-0">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <h3 class="h5"><i class="bi bi-people-fill text-primary me-2"></i>Gestión de Clientes</h3>
                            <ul class="mt-3">
                                <li>Registro y fichas médicas</li>
                                <li>Control de membresías</li>
                                <li>Asistencia automática</li>
                            </ul>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-5">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <h3 class="h5"><i class="bi bi-clipboard2-pulse-fill text-success me-2"></i>Planificación</h3>
                            <ul class="mt-3">
                                <li>Creación de rutinas</li>
                                <li>Biblioteca de ejercicios</li>
                                <li>Seguimiento de progreso</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
          
    <footer th:replace="fragments :: footer"></footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
