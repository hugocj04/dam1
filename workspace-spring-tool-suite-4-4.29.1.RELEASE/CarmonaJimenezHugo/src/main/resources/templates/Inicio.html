<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Gestión para Gimnasios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-white">

    <header th:replace="fragments :: header"></header>
    
    <div th:replace="fragments :: menu"></div>

    <main class="container-fluid flex-grow-1">
        <section class="bg-dark text-white py-5">
            <div class="container py-4">
                <div class="row justify-content-center text-center">
                    <div class="col-lg-8">
                        <h1 class="display-5 fw-bold mb-4">Sistema de gestión para gimnasios</h1>
                        <p class="lead">
                            Control de clientes y rutinas en una sola plataforma
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <section class="container my-5 py-4">
            <div class="row justify-content-center">
                <div class="col-md-5 mb-4 mb-md-0">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <h3 class="h5"><i class="bi bi-people-fill text-primary me-2"></i>Gestión de Clientes</h3>
                            <ul class="mt-3">
                                <li>Control de membresías</li>
                                <li>Asistencia automática</li>
                            </ul>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-5">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <h3 class="h5"><i class="bi bi-clipboard2-pulse-fill text-success me-2"></i>Planificación</h3>
                            <ul class="mt-3">
                                <li>Creación de rutinas</li>
                                <li>Biblioteca de ejercicios</li>
                                <li>Seguimiento de progreso</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="container py-5">
            <div class="text-center mb-5">
                <h2 class="display-5 fw-bold">Galería de Ejercicios</h2>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div id="exerciseCarousel" class="carousel slide" data-bs-ride="carousel">
                        <div class="carousel-inner rounded-3 shadow-lg ratio ratio-16x9">

                            <div class="carousel-item active">
                                <div class="d-flex justify-content-center align-items-center h-100">
                                    <img src="https://hips.hearstapps.com/hmg-prod/images/sentadillas-2-1500285620.jpg?crop=1.00xw:0.601xh;0,0.178xh&resize=2048:*" 
                                         class="img-fluid w-100 h-100 object-fit-cover" 
                                         alt="Sentadillas">
                                </div>
                            </div>
                            
                            <div class="carousel-item">
                                <div class="d-flex justify-content-center align-items-center h-100">
                                    <img src="https://ignittion.es/wp-content/uploads/2022/04/Man-performing-a-push-up.jpg" 
                                        class="img-fluid w-100 h-100 object-fit-cover" 
                                        alt="Flexiones">
                                </div>
                            </div>
                            
                            <div class="carousel-item">
                                <div class="d-flex justify-content-center align-items-center h-100">
                                    <img src="https://rlgrips.com/wp-content/uploads/2024/10/chico-dominadas.jpg" 
                                         class="img-fluid w-100 h-100 object-fit-cover" 
                                         alt="Dominadas">
                                </div>
                            </div>

                            <div class="carousel-item">
                                <div class="d-flex justify-content-center align-items-center h-100">
                                    <img src="https://www.myprotein.es/images?url=https://blogscdn.thehut.net/app/uploads/sites/450/2016/09/bench-press_1595337964_1595417256.jpg&auto=avif&width=700&fit=crop" 
                                         class="img-fluid w-100 h-100 object-fit-cover" 
                                         alt="Press banca">
                                </div>
                            </div>
                        </div>
                        
                        <button class="carousel-control-prev" type="button" data-bs-target="#exerciseCarousel" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon bg-dark rounded-circle p-3" aria-hidden="true"></span>
                            <span class="visually-hidden">Anterior</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#exerciseCarousel" data-bs-slide="next">
                            <span class="carousel-control-next-icon bg-dark rounded-circle p-3" aria-hidden="true"></span>
                            <span class="visually-hidden">Siguiente</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
          
    <footer th:replace="fragments :: footer"></footer>
    
</body>
</html>
