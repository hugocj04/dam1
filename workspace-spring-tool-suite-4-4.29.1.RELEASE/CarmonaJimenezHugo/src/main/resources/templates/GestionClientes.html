<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Ver clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <header th:replace="fragments :: header"></header>

    <div th:replace="fragments :: menu"></div>

    <main class="container flex-grow-1 py-5">
        <div class="text-center mb-5">
            <h2 class="h4 text-dark">
                <i class="bi bi-people-fill me-2"></i>Lista de Clientes
            </h2>
            <p class="text-muted mb-0">Consulta, edita o elimina la información de los clientes</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-xl-11">
                <div class="table-responsive">
                    <table class="table table-striped table-bordered table-hover align-middle mb-4">
                        <thead class="table-dark">
                            <tr>
                                <th class="px-3 text-warning">Fecha</th>
                                <th class="px-3 text-warning">Nombre</th>
                                <th class="px-3 text-warning">Apellidos</th>
                                <th class="px-3 text-warning">Edad</th>
                                <th class="px-3 text-warning">Email</th>
                                <th class="px-3 text-warning">Teléfono</th>
                                <th class="px-3 text-center text-warning">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cliente : ${listar}">
                                <td th:text="${cliente.fecha}" class="px-3"></td>
                                <td th:text="${cliente.nombre}" class="px-3"></td>
                                <td th:text="${cliente.apellidos}" class="px-3"></td>
                                <td th:text="${cliente.edad}" class="text-center px-3"></td>
                                <td th:text="${cliente.email}" class="px-3"></td>
                                <td th:text="${cliente.telefono}" class="px-3"></td>
                                <td class="text-center px-3">
                                    <div class="d-flex gap-2 justify-content-center">
                                        <a th:href="@{'/editarCliente/' + ${cliente.id}}" class="btn btn-outline-primary btn-sm">
                                            <i class="bi bi-pencil me-1"></i>Editar
                                        </a>
                                        <form th:action="@{'/eliminarCliente/' + ${cliente.id}}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                                <i class="bi bi-trash me-1"></i>Borrar
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments :: footer"></footer>
    
</body>
</html>
