<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Registrar cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-white">
    <header th:replace="fragments :: header"></header>

    <div th:replace="fragments :: menu"></div>

    <main class="container flex-grow-1 py-4">
        <div class="text-center mb-4">
            <h2>Registrar cliente</h2>
            <p class="text-muted">Complete los datos del nuevo cliente</p>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5"> <!-- Columnas progresivamente más estrechas -->
                <form method="POST" th:action="@{/registrar}" th:object="${cliente}" 
                      class="border rounded p-3 p-sm-4 shadow-sm bg-light mx-auto" style="max-width: 500px;"> <!-- max-width con estilo inline -->
                    
                    <div class="row g-3">
                        <!-- Fecha -->
                        <div class="col-12">
                            <label for="fecha" class="form-label">Fecha de registro</label>
                            <input type="date" th:field="*{fecha}" class="form-control form-control-sm" id="fecha" required>
                        </div>
                        
                        <!-- Nombre y Apellidos -->
                        <div class="col-md-6">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control form-control-sm" id="nombre" required>
                        </div>
                        <div class="col-md-6">
                            <label for="apellidos" class="form-label">Apellidos</label>
                            <input type="text" th:field="*{apellidos}" class="form-control form-control-sm" id="apellidos" required>
                        </div>
                        
                        <!-- Edad y Teléfono -->
                        <div class="col-md-6">
                            <label for="edad" class="form-label">Edad</label>
                            <input type="number" th:field="*{edad}" class="form-control form-control-sm" id="edad" required>
                        </div>
                        <div class="col-md-6">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" th:field="*{telefono}" class="form-control form-control-sm" id="telefono" required>
                        </div>
                        
                        <!-- Email -->
                        <div class="col-12">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" th:field="*{email}" class="form-control form-control-sm" id="email" required>
                        </div>
                        
                        <!-- Botón de submit -->
                        <div class="col-12 mt-3">
                            <button type="submit" class="btn btn-success w-100 py-2">
                                <i class="bi bi-person-plus me-2"></i>Agregar cliente
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
        
    <footer th:replace="fragments :: footer"></footer>
</body>
</html>
