<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Crear nueva rutina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <header th:replace="fragments :: header"></header>

    <div th:replace="fragments :: menu"></div>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-6">
                <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
                    <div class="card-header bg-dark text-warning py-3">
                        <div class="d-flex align-items-center justify-content-between">
                            <h2 class="h5 mb-0">
                                <i class="bi bi-clipboard-plus me-2"></i>Asignar nueva rutina
                            </h2>
                        </div>
                    </div>
                    
                    <div class="card-body p-4 p-md-5">
                        <form method="POST" th:action="@{/asignarRutina}" th:object="${rutina}">
                            <div class="mb-4">
                                <h5 class="text-dark mb-3">
                                    <i class="bi bi-person-vcard me-2"></i>Datos del cliente
                                </h5>
                                <div class="mb-3">
                                    <label for="clienteId" class="form-label fw-semibold">Seleccionar cliente</label>
                                    <select name="cliente.id" id="clienteId" class="form-select" required>
                                        <option value="" disabled selected>-- Elija un cliente --</option>
                                        <option th:each="cliente : ${clientes}"
                                                th:value="${cliente.id}"
                                                th:text="${cliente.nombre + ' ' + cliente.apellidos}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <h5 class="text-dark mb-3">
                                    <i class="bi bi-calendar-week me-2"></i>Planificación
                                </h5>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="diaSemana" class="form-label fw-semibold">Día de entrenamiento</label>
                                        <select th:field="*{diaSemana}" class="form-select" id="diaSemana" required>
                                            <option value="" disabled selected>-- Seleccione día --</option>
                                            <option value="Lunes">Lunes</option>
                                            <option value="Martes">Martes</option>
                                            <option value="Miércoles">Miércoles</option>
                                            <option value="Jueves">Jueves</option>
                                            <option value="Viernes">Viernes</option>
                                            <option value="Sábado">Sábado</option>
                                            <option value="Domingo">Domingo</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="descanso" class="form-label fw-semibold">Tiempo de descanso</label>
                                        <input type="time" th:field="*{descanso}" class="form-control" id="descanso" required>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <h5 class="text-dark mb-3">
                                    <i class="bi bi-activity me-2"></i>Detalles del ejercicio
                                </h5>
                                <div class="row g-3">
                                    <div class="col-md-8">
                                        <label for="ejercicio" class="form-label fw-semibold">Nombre del ejercicio</label>
                                        <input type="text" th:field="*{ejercicio}" class="form-control" id="ejercicio" 
                                               placeholder="Ej: Press banca" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="urlImagen" class="form-label fw-semibold">URL de imagen</label>
                                        <input type="url" th:field="*{urlImagen}" class="form-control" id="urlImagen" 
                                               placeholder="https://ejemplo.com/imagen.jpg" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="series" class="form-label fw-semibold">N° de series</label>
                                        <input type="number" th:field="*{series}" class="form-control" id="series" min="1" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="repeticiones" class="form-label fw-semibold">Repeticiones</label>
                                        <input type="number" th:field="*{repeticiones}" class="form-control" id="repeticiones" min="1" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="peso" class="form-label fw-semibold">Peso (Kg)</label>
                                        <div class="input-group">
                                            <input type="number" step="0.1" th:field="*{peso}" class="form-control" id="peso" min="0" required>
                                            <span class="input-group-text">Kg</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-3 mt-4">
                                <button type="submit" class="btn btn-warning text-dark py-2">
                                    <i class="bi bi-save me-2"></i>Guardar rutina
                                </button>
                                <a th:href="@{/gestionRutinas}" class="btn btn-outline-dark py-2">
                                    <i class="bi bi-x-circle me-2"></i>Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                    
                    <div class="card-footer bg-dark py-3 text-center">
                        <small class="text-warning">
                            <i class="bi bi-info-circle me-1"></i> Todos los campos son obligatorios
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments :: footer"></footer>
</body>
</html>
