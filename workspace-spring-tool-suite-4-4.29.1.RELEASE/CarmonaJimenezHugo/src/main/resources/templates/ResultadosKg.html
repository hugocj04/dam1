<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Kilogramos Totales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    
    <header th:replace="fragments :: header"></header>
    
    <div th:replace="fragments :: menu"></div>

    <main class="container flex-grow-1 py-5">
        <div class="text-center mb-5">
            <h2 class="h4 text-dark">
                <i class="bi bi-graph-up me-2"></i>Análisis de entrenamiento
            </h2>
            <p class="text-muted mb-0">Métricas y estadísticas del cliente</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-xl-11">
                <div class="card mb-5 shadow-sm border-0 rounded-3 overflow-hidden">
                    <div class="card-header bg-dark text-warning py-3">
                        <div class="d-flex align-items-center justify-content-between">
                            <h3 class="h6 mb-0" th:text="'Rutina de ' + ${cliente.nombre} + ' ' + ${cliente.apellidos}"></h3>
                            <a th:href="@{/analisis}" class="btn btn-sm btn-outline-warning">
                                <i class="bi bi-arrow-left me-1"></i>Volver
                            </a>
                        </div>
                    </div>

                    <div class="card-body p-4 bg-white">
                        <div th:if="${not #lists.isEmpty(cliente.ListaRutinas)}" class="table-responsive mb-4">
                            <table class="table table-bordered table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th class="text-nowrap px-3">Día</th>
                                        <th class="px-3">Ejercicio</th>
                                        <th class="px-3">Series</th>
                                        <th class="px-3">Repeticiones</th>
                                        <th class="px-3">Peso (Kg)</th>
                                        <th class="px-3">Volumen (Kg)</th>
                                        <th class="px-3">Imagen</th>
                                        <th class="px-3">Descanso</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="rutina : ${cliente.ListaRutinas}">
                                        <td th:text="${rutina.diaSemana}" class="fw-semibold px-3"></td>
                                        <td th:text="${rutina.ejercicio}" class="px-3"></td>
                                        <td th:text="${rutina.series}" class="text-center px-3"></td>
                                        <td th:text="${rutina.repeticiones}" class="text-center px-3"></td>
                                        <td th:text="${rutina.peso}" class="text-center px-3"></td>
                                        <td class="text-center px-3 fw-bold text-warning" th:text="${#numbers.formatDecimal(rutina.series * rutina.repeticiones * rutina.peso, 1, 2)}"></td>
                                        <td class="text-center px-3">
                                            <img th:src="${rutina.urlImagen}" th:alt="${rutina.alt}" class="img-fluid rounded"
                                                 style="width: 180px; height: 100px; object-fit: cover;" />
                                        </td>
                                        <td th:text="${rutina.descanso}" class="text-center px-3"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div th:if="${#lists.isEmpty(cliente.ListaRutinas)}" class="mt-4 text-center">
                            <p class="text-muted">No se han encontrado rutinas para este cliente.</p>
                        </div>

                        <div class="border-top pt-4">
                            <h5 class="text-dark mb-3 text-center">
                                <i class="bi bi-bar-chart me-2"></i>Total de Kg levantados
                            </h5>
                            <p class="display-5 fw-bold text-center text-warning"
                               th:text="${#numbers.formatDecimal(totalKg, 1, 2) + ' kg'}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments :: footer"></footer>

</body>
</html>
