<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Aviso Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-white">
    <header th:replace="fragments :: header"></header>
    
    <div th:replace="fragments :: menu"></div>

    <main class="container-fluid flex-grow-1 py-5 bg-light">
        <h2 class="mb-4 text-center">Analisis de entrenamiento</h2>
        <div class="mb-3">
            <label for="clienteId" class="form-label">Selecciona un cliente</label>
            <select name="cliente.id" id="clienteId" class="form-select" required>
                <option value="" disabled selected>Clientes</option>
                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:text="${cliente.nombre + ' ' + cliente.apellidos}">
                </option>
            </select>
        </div>
    </main>
          
    <footer th:replace="fragments :: footer"></footer>
</body>
</html>
