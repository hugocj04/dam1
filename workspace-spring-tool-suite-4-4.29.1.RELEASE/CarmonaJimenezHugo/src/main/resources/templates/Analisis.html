<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Análisis de entrenamiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <header th:replace="fragments :: header"></header>
    
    <div th:replace="fragments :: menu"></div>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h2 class="mb-4 text-center text-primary fw-bold">
                            <i class="bi bi-graph-up me-2"></i>Análisis de Entrenamiento
                        </h2>
                        <form th:action="@{/analisis/cliente}" method="get" class="border rounded-3 p-3 shadow-sm bg-light">
                            <div class="mb-4">
                                <label for="clienteId" class="form-label fw-semibold text-muted">
                                    <i class="bi bi-person-fill me-2"></i>Selecciona un cliente
                                </label>
                                <select name="clienteid" id="clienteId" class="form-select form-select-lg shadow-sm rounded-3" required>
                                    <option value="" disabled selected>-- Elige un cliente --</option>
                                    <option th:each="cliente : ${clientes}"
                                            th:value="${cliente.id}"
                                            th:text="${cliente.nombre + ' ' + cliente.apellidos}">
                                    </option>
                                </select>
                                <div class="mt-2 text-end">
                                    <button class="btn btn-primary rounded-pill px-4">
                                        <i class="bi bi-arrow-right me-2"></i>Continuar
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
          
    <footer th:replace="fragments :: footer"></footer>
</body>
</html>
