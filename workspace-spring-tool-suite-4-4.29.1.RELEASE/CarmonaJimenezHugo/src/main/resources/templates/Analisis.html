<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Análisis de entrenamiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <header th:replace="fragments :: header"></header>

    <div th:replace="fragments :: menu"></div>

    <main class="container flex-grow-1 py-5">
        <div class="text-center mb-5">
            <h2 class="h4 text-dark">
                <i class="bi bi-graph-up me-2"></i>Análisis de entrenamiento
            </h2>
            <p class="text-muted mb-0">Selecciona un cliente para ver su progreso</p>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <form th:action="@{/analisis/cliente}" method="get" class="border rounded-3 p-4 shadow-sm bg-white">
                    <div class="mb-3">
                        <label for="clienteId" class="form-label fw-semibold text-muted mb-2">
                            <i class="bi bi-person-fill me-2"></i>Seleccionar cliente
                        </label>
                        <div class="input-group">
                            <select name="clienteid" id="clienteId" class="form-select shadow-sm" required>
                                <option value="" disabled selected>-- Elige un cliente --</option>
                                <option th:each="cliente : ${clientes}"
                                        th:value="${cliente.id}"
                                        th:text="${cliente.nombre + ' ' + cliente.apellidos}">
                                </option>
                            </select>
                            <button type="submit" class="btn btn-warning text-dark px-4">
                                <i class="bi bi-arrow-right me-2"></i>Continuar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="fragments :: footer"></footer>
    
</body>
</html>
