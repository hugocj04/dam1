<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlanner - Volumen Semanal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <header th:replace="fragments :: header"></header>
    
    <div th:replace="fragments :: menu"></div>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="card shadow-sm border-0 rounded-4 mb-4">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="h4 mb-3 text-primary" th:text="'Rutina de ' + ${cliente.nombre} + ' ' + ${cliente.apellidos}"></h3>
                        </div>
                        
                        <div class="table-responsive-lg">
                            <table class="table table-bordered table-hover shadow-sm bg-white">
                                <thead class="table-primary">
                                    <tr>
                                        <th class="text-nowrap px-3">Día</th>
                                        <th class="px-3">Ejercicio</th>
                                        <th class="px-3">Series</th>
                                        <th class="px-3">Repeticiones</th>
                                        <th class="px-3">Peso (Kg)</th>
                                        <th class="px-3">Imagen</th>
                                        <th class="px-3">Descanso</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="rutina : ${cliente.ListaRutinas}">
                                        <td th:text="${rutina.diaSemana}" class="fw-semibold px-3"></td>
                                        <td th:text="${rutina.ejercicio}" class="px-3"></td>
                                        <td th:text="${rutina.series}" class="text-center px-3"></td>
                                        <td th:text="${rutina.repeticiones}" class="text-center px-3"></td>
                                        <td th:text="${rutina.peso}" class="text-center px-3"></td>
                                        <td class="text-center px-3">
                                            <div class="d-flex justify-content-center">
                                                <img th:src="${rutina.urlImagen}" 
                                                    th:alt="${rutina.alt}"
                                                    class="img-fluid rounded"
                                                    style="width: 180px; height: 100px; object-fit: cover;">
                                            </div>
                                        </td>
                                        <td th:text="${rutina.descanso}" class="text-center px-3"></td>
                                    </tr>
                                </tbody>
                            </table>

                        </div>
                        

                        <div th:if="${#lists.isEmpty(cliente.ListaRutinas)}" class="mt-4 text-center">
                            <p>No se han encontrado rutinas para este cliente.</p>
                        </div>
                    </div>


                    <div class="card shadow-sm border-0">
                        <div class="card-body text-center">
                            <h4 class="text-primary mb-3">Total de Series Semanales</h4>
                            <p class="display-4 fw-bold text-primary" th:text="${totalSeries}"></p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>
          
    <footer th:replace="fragments :: footer"></footer>
</body>
</html>
